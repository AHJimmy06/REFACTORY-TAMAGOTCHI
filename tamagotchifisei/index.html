<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamagotchi Proyecto FISEI</title>
    <script src="./phaser.min.js"></script>
    <script type="module" src="./game.js"></script>
    <style>
      body {
        display: grid;
        place-items: center;
        height: 100vh;
        background: black;
        margin: 0;
      }
      #game {
        border: 1px solid white;
      }
      #eatButton {
        margin-top: 10px;
        padding: 10px 20px;
        background-color: #049cd8;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      #eatButton:hover {
        background-color: #036f9b;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="eatButton">Comer</button>
  </body>
</html>
